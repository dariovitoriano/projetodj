<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJ Musicas</title>
</head>
<body>
  <h1>DJ Musicas</h1>

  <h2>Registro</h2>
  <form id="registerForm">
    <input type="email" id="registerEmail" placeholder="Email" required>
    <input type="password" id="registerPassword" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>

  <h2>Login</h2>
  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <h2>Músicas</h2>
  <button id="getMusicasBtn">Obter Músicas</button>
  <ul id="musicasList"></ul>

  <script>
    const API_URL = 'https://projetodj.onrender.com';

    // Registro
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;

      const response = await fetch(`${API_URL}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json().catch(() => ({}));

      if (response.ok) {
        alert('Usuário registrado com sucesso!');
      } else {
        alert('Erro ao registrar: ' + (data.message || 'erro desconhecido'));
      }
    });

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      const response = await fetch(`${API_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json().catch(() => ({}));

      if (response.ok) {
        localStorage.setItem('token', data.token);
        alert('Login realizado com sucesso!');
      } else {
        alert('Falha no login: ' + (data.message || 'credenciais inválidas'));
      }
    });

    // Buscar músicas
    document.getElementById('getMusicasBtn').addEventListener('click', async () => {
      const token = localStorage.getItem('token');

      if (!token) {
        alert('Faça login primeiro!');
        return;
      }

      const response = await fetch(`${API_URL}/musicas`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        alert('Erro ao buscar músicas: ' + (data.message || 'erro desconhecido'));
        return;
      }

      const musicas = await response.json();
      const musicasList = document.getElementById('musicasList');
      musicasList.innerHTML = '';

      musicas.forEach(musica => {
        const li = document.createElement('li');
        li.textContent = `${musica.titulo} - ${musica.artista}`;
        musicasList.appendChild(li);
      });
    });
  </script>
</body>
</html>
